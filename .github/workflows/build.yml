name: Build UPDOWN_TOOL EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore UPDOWN_TOOL.vbproj

      - name: Publish self-contained win-x64 EXE
        run: dotnet publish UPDOWN_TOOL.vbproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish_output

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: UPDOWN_TOOL-win-x64
          path: publish_output/UPDOWN_TOOL.exe
